apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodwasteportal
  labels:
    app: foodwasteportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodwasteportal
  template:
    metadata:
      labels:
        app: foodwasteportal
    spec:
      containers:
        - name: portal
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: foodwasteportal
spec:
  type: NodePort
  selector:
    app: foodwasteportal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
